[pytest]
pythonpath = .
testpaths = tests
DJANGO_SETTINGS_MODULE = openoutfind.settings
markers =
    hub_off: run with the fork default HUB_ENABLED=False
    no_embed_mock: skip the autouse fastembed mock
    no_contact_capture_mock: skip the autouse contact-info capture mock
    no_llm_mock: skip the autouse credential-check mock (for the tests of that check)
